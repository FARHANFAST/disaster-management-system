# Scenario presets (§3.8, §6.5): data only in Milestone 1 — dms/scenario/*.py
# (event application, debounced recompute) is implemented in a later milestone.
scenarios:
  baseline:
    description: "everything AVAILABLE; X-SE locked; clutter and parking off"
    events:
      - {type: SetDoorState, id: X-SE, state: UNAVAILABLE}

  slide23_A:
    description: "no clutter; exits open; no parked cars"
    events: []

  slide23_B:
    description: "no clutter; exits open; cars parked"
    events:
      - {type: ToggleLayer, layer: parking, on: true}

  slide23_C:
    description: "clutter on; emergency exits closed (X-NW, X-E UNAVAILABLE); no cars"
    events:
      - {type: ToggleLayer, layer: clutter, on: true}
      - {type: SetExitState, id: X-NW, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}

  slide23_D:
    description: "clutter on; exits closed; cars parked"
    events:
      - {type: ToggleLayer, layer: clutter, on: true}
      - {type: SetExitState, id: X-NW, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}
      - {type: ToggleLayer, layer: parking, on: true}

  block_main_exit:
    description: "X-S UNAVAILABLE"
    events:
      - {type: SetExitState, id: X-S, state: UNAVAILABLE}

  block_ringS_mid:
    description: "south ring segment in front of LOBBY UNAVAILABLE (LOBBY<->ring-S opening blocked)"
    events:
      - {type: SetLinkState, id: LOBBY-op-ringS, state: UNAVAILABLE}

  leak_H1:
    description: "H-1 active; nearby links/cells become PARTIAL"
    events:
      - {type: ActivateSource, id: H-1}

  leak_H2:
    description: "H-2 active; nearby links/cells become PARTIAL"
    events:
      - {type: ActivateSource, id: H-2}

  leak_H3:
    description: "H-3 active (PARTIAL north ring on FF)"
    events:
      - {type: ActivateSource, id: H-3}

  stair_C_lost:
    description: "ST-C UNAVAILABLE"
    events:
      - {type: SetLinkState, id: ST-C, state: UNAVAILABLE}

  two_stairs_lost:
    description: "ST-C and ST-E UNAVAILABLE (FF must still egress via ST-W)"
    events:
      - {type: SetLinkState, id: ST-C, state: UNAVAILABLE}
      - {type: SetLinkState, id: ST-E, state: UNAVAILABLE}
