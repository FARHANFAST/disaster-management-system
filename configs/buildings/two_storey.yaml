# Two-storey building + site — authoritative geometry (PROMPT_01_two_storey_building.md §3).
# All coordinates are metres. GF/FF local origin = SW outer corner of the building footprint.
# Code must never hardcode any of these numbers (PROMPT_01 §2.1, §9) — this file is the
# single source of truth; dms/geometry/loader.py only interprets it.

site:
  name: "PAEC / NUST AI Solution Lab — two-storey building prototype site"
  width_m: 160.0
  height_m: 140.0
  assembly_points:
    - {id: AP-N, x: 80.0, y: 125.0, diameter_m: 15.0}
    - {id: AP-S, x: 80.0, y: 15.0, diameter_m: 15.0}
    - {id: AP-W, x: 15.0, y: 70.0, diameter_m: 15.0}
    - {id: AP-E, x: 145.0, y: 70.0, diameter_m: 15.0}
  obstacles:
    - {id: outbuilding, x0: 20.0, y0: 110.0, x1: 30.0, y1: 118.0, layer: static}
    # Parking layer (§3.5): a row of 2x4.5 m cars in front of X-S and X-E, off by default.
    - {id: car-S-1, x0: 78.0, y0: 40.0, x1: 80.0, y1: 44.5, layer: parking, active_by_default: false}
    - {id: car-S-2, x0: 80.5, y0: 40.0, x1: 82.5, y1: 44.5, layer: parking, active_by_default: false}
    - {id: car-E-1, x0: 115.0, y0: 68.0, x1: 119.5, y1: 70.0, layer: parking, active_by_default: false}
    - {id: car-E-2, x0: 115.0, y0: 70.5, x1: 119.5, y1: 72.5, layer: parking, active_by_default: false}
  hazards:
    - {id: H-4, x: 140.0, y: 40.0, z: 0.0, species: H2S, mw: 34.08, purpose: "outdoor tank, dispersion toward the building with wind"}

buildings:
  - id: B1
    origin: {x: 50.0, y: 50.0}
    rotation_deg: 0.0
    wall_thickness_m: 0.2
    floor_to_floor_m: 4.0
    # Every room with exactly one door (graph degree 1 on the L2 navigation
    # graph) — spec §7.2: "the exception [to single-failure redundancy] is
    # rooms whose only door is the failed element... designed_dead_ends list
    # (G-08, F-10, F-13, FN-stub, single-door offices)". Computed via
    # dms/graph/redundancy.py and verified exact (not just a superset) by
    # tests/test_redundancy.py. FN-stub is deliberately NOT in this list:
    # it has two connections (an opening to ring-N and a door to F-07) and
    # so is not a single point of failure — its "dead end" property is a
    # different one (no exit of its own on FF; see its own `notes` field
    # under FF's spaces, and the M4 edge-case walker check).
    designed_dead_ends: [
      F-01, F-04, F-08, F-09, F-10, F-13,
      G-01, G-03, G-04, G-07, G-08, G-09, G-10, G-12, G-13, G-14, G-17, G-18, G-20,
    ]
    window_rule: {width_m: 1.5, spacing_m: 3.0, sill_height_m: 0.9, perm_closed: 0.02, perm_open: 0.5}

    # Named exit sets for the Eikonal field targets (PROMPT_01 §6.3). "all"
    # (every currently-available exit) needs no entry here — dms/fields/eikonal.py
    # treats that name specially, and falls back to treating any other
    # unlisted name as a literal single exit id.
    exit_sets:
      all_but_S: [X-N, X-W, X-E, X-NW, X-SE]
      north: [X-N]
      south: [X-S]
      west: [X-W, X-NW]
      east: [X-E, X-SE]

