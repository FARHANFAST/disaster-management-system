    stairs:
      - id: ST-W
        landings:
          - {floor: GF, space: ST-W}
          - {floor: FF, space: ST-W}
        width_m: 1.2  # spec §3: narrow enclosed fire stair, direct exterior discharge
        riser_m: 0.17
        tread_m: 0.28
        flights: 2
        chi: 0.70
        enclosed: true
        discharge_exit: X-NW
        fire_doors:
          - {floor: GF, wall: "x=8", lo: 26.0, hi: 27.5}
          - {floor: FF, wall: "x=8", lo: 26.0, hi: 27.5}

      - id: ST-E
        landings:
          - {floor: GF, space: ST-E}
          - {floor: FF, space: ST-E}
        width_m: 1.5  # spec §3: enclosed fire stair (unchanged)
        riser_m: 0.17
        tread_m: 0.28
        flights: 2
        chi: 0.70
        enclosed: true
        fire_doors:
          - {floor: GF, wall: "x=52", lo: 12.0, hi: 13.5}
          - {floor: FF, wall: "x=52", lo: 12.0, hi: 13.5}

      - id: ST-C
        landings:
          - {floor: GF, space: ST-C}
          - {floor: FF, space: ST-C}
        width_m: 2.4  # spec §3: main open stair
        riser_m: 0.17
        tread_m: 0.28
        flights: 2
        chi: 0.70
        enclosed: false
        fire_doors: []

    # spec §7: explicit vertical gas coupling, independent of the
    # void-column/stair-landing auto-discovery (dms/hazards/topology.py) --
    # F-14's HVAC plant room (FF) sits directly above G-10, the utility &
    # gas manifold room (GF).
    risers:
      - id: riser-F14-G10
        a: {floor: FF, space: F-14}
        b: {floor: GF, space: G-10}
        coefficient: 1.0

    # spec §6.1: per-`use` occupancy, keyed by time-of-day column.
    # Each entry is EITHER a fixed `count`, a `count_range: [lo, hi]`
    # (uniform-random headcount, for sporadic/low-traffic spaces), or a
    # `density_per_m2` (scaled by the room's own floor area at sample time).
    occupancy_profiles:
      office: {day: {density_per_m2: 0.10}, lunch: {density_per_m2: 0.03}, meeting: {density_per_m2: 0.06}, night: {count: 0}}
      open_office: {day: {density_per_m2: 0.14}, lunch: {density_per_m2: 0.04}, meeting: {density_per_m2: 0.08}, night: {count: 0}}
      control_room: {day: {count: 3}, lunch: {count: 2}, meeting: {count: 3}, night: {count: 1}}
      conference: {day: {count: 0}, lunch: {count: 0}, meeting: {density_per_m2: 0.5}, night: {count: 0}}
      cafeteria: {day: {density_per_m2: 0.05}, lunch: {density_per_m2: 0.4}, meeting: {density_per_m2: 0.05}, night: {count: 0}}
      lab: {day: {count: 3}, lunch: {count: 1}, meeting: {count: 2}, night: {count: 0}}
      training: {day: {count: 0}, lunch: {count: 0}, meeting: {density_per_m2: 0.4}, night: {count: 0}}
      plant_room: {day: {count_range: [0, 1]}, lunch: {count: 0}, meeting: {count_range: [0, 1]}, night: {count_range: [0, 1]}}
      hvac_plant: {day: {count_range: [0, 1]}, lunch: {count: 0}, meeting: {count_range: [0, 1]}, night: {count_range: [0, 1]}}
      chemical_store: {day: {count_range: [0, 1]}, lunch: {count: 0}, meeting: {count_range: [0, 1]}, night: {count: 0}}
      toilets: {day: {count_range: [0, 2]}, lunch: {count_range: [0, 3]}, meeting: {count_range: [0, 1]}, night: {count_range: [0, 1]}}
      store: {day: {count_range: [0, 1]}, lunch: {count: 0}, meeting: {count_range: [0, 1]}, night: {count: 0}}
      library: {day: {density_per_m2: 0.03}, lunch: {density_per_m2: 0.02}, meeting: {density_per_m2: 0.03}, night: {count: 0}}
      lobby: {day: {density_per_m2: 0.02}, lunch: {density_per_m2: 0.03}, meeting: {density_per_m2: 0.02}, night: {count_range: [0, 1]}}
      corridor: {day: {density_per_m2: 0.01}, lunch: {density_per_m2: 0.02}, meeting: {density_per_m2: 0.01}, night: {count: 0}}

    # spec §6.2: plant-staff persona mix (walking speeds from
    # SYSTEM_SPEC.md's table live in dms/scenario/population.py, not here).
    persona_mix:
      adult_m: 0.45
      adult_f: 0.40
      elderly_m: 0.08
      elderly_f: 0.05
      mobility_impaired: 0.02

# Scenario presets (§3.8, §6.5): data only in Milestone 1 — dms/scenario/*.py
# (event application, debounced recompute) is implemented in a later milestone.
scenarios:
  baseline:
    description: "everything AVAILABLE; X-SE locked; clutter and parking off"
    events:
      - {type: SetDoorState, id: X-SE, state: UNAVAILABLE}

  slide23_A:
    description: "no clutter; exits open; no parked cars"
    events: []

  slide23_B:
    description: "no clutter; exits open; cars parked"
    events:
      - {type: ToggleLayer, layer: parking, on: true}

  slide23_C:
    description: "clutter on; emergency exits closed (X-NW, X-E UNAVAILABLE); no cars"
    events:
      - {type: ToggleLayer, layer: clutter, on: true}
      - {type: SetExitState, id: X-NW, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}

  slide23_D:
    description: "clutter on; exits closed; cars parked"
    events:
      - {type: ToggleLayer, layer: clutter, on: true}
      - {type: SetExitState, id: X-NW, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}
      - {type: ToggleLayer, layer: parking, on: true}

  block_main_exit:
    description: "X-S UNAVAILABLE"
    events:
      - {type: SetExitState, id: X-S, state: UNAVAILABLE}

  block_ringS_mid:
    description: "south ring segment in front of LOBBY UNAVAILABLE (LOBBY<->ring-S opening blocked)"
    events:
      - {type: SetLinkState, id: LOBBY-op-ringS, state: UNAVAILABLE}

  leak_H1:
    description: "H-1 active; nearby links/cells become PARTIAL"
    events:
      - {type: ActivateSource, id: H-1}

  leak_H2:
    description: "H-2 active; nearby links/cells become PARTIAL"
    events:
      - {type: ActivateSource, id: H-2}

  leak_H3:
    description: "H-3 active (PARTIAL north ring on FF)"
    events:
      - {type: ActivateSource, id: H-3}

  stair_C_lost:
    description: "ST-C UNAVAILABLE"
    events:
      - {type: SetLinkState, id: ST-C, state: UNAVAILABLE}

  two_stairs_lost:
    description: "ST-C and ST-E UNAVAILABLE (FF must still egress via ST-W)"
    events:
      - {type: SetLinkState, id: ST-C, state: UNAVAILABLE}
      - {type: SetLinkState, id: ST-E, state: UNAVAILABLE}

  # spec §5: exit-state presets, pure data -- apply_event already
  # passes any state string through unchanged (confirmed), so these need
  # no new code.
  exit_N_blocked_unknown:
    description: "X-N blocked but not signposted -- agents discover it on arrival (R_vis) and reroute"
    events:
      - {type: SetExitState, id: X-N, state: BLOCKED_UNKNOWN}

  exits_W_E_blocked:
    description: "X-W and X-E UNAVAILABLE"
    events:
      - {type: SetExitState, id: X-W, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}

  main_exit_partial:
    description: "X-S PARTIAL -- one leaf of the double door jammed, effective width halved"
    events:
      - {type: SetExitState, id: X-S, state: PARTIAL}

  only_two_exits:
    description: "only X-S and X-N available"
    events:
      - {type: SetExitState, id: X-W, state: UNAVAILABLE}
      - {type: SetExitState, id: X-E, state: UNAVAILABLE}
      - {type: SetExitState, id: X-NW, state: UNAVAILABLE}
      - {type: SetExitState, id: X-SE, state: UNAVAILABLE}
