# Irregular 3-storey building fixture -- proves the N-floor
# generalization (Stair.landings subsets, recursive Eikonal coupling, redundancy.py
# genericity) against a building that is NOT a scaled repeat of two_storey.yaml:
# a stair spanning only floors L1-L2 (ST-SUB), an external fire stair (ST-FIRE) with
# its own direct exterior discharge, an L-shaped corridor (corr-A + corr-B meeting at
# a right-angle corner), and L3's internal layout genuinely differing from L2's (the
# ST-SUB slot becomes two ordinary offices instead of a stair).
#
# Generated once by a scratch script (not committed) and then hand-reviewed; this file
# itself is the static, authoritative fixture -- it is not regenerated at test time.

